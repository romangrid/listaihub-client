[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "listaihub-client"
version = "1.0.0"
authors = [
  { name = "Roman Grid", email = "romangrid@users.noreply.github.com" },
]
description = "Official Python SDK & Agent Client for ListAIHub directory API"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://listaihub.com/en/developers"
"Directory" = "https://listaihub.com/"
"API Docs" = "https://listaihub.com/agent/openapi.json"
"Bug Tracker" = "https://github.com/romangrid/listaihub-client/issues"

[project.scripts]
listaihub = "listaihub.cli:main"
